<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intelligence Games |Zeyad Hany EL-Nagar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        
    .beta-footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(33, 37, 41, 0.95); /* لون داكن مع شفافية بسيطة */
    color: white;
    text-align: center;
    padding: 12px 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    border-top: 2px solid #007bff; /* خط علوي بلون أزرق ليعطي لمسة جمالية */
    backdrop-filter: blur(5px); /* تأثير زجاجي خلف الشريط */
  }

  .beta-tag {
    background-color: #007bff;
    color: white;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .close-beta {
    cursor: pointer;
    font-size: 18px;
    margin-right: 15px;
    color: #aaa;
    transition: 0.3s;
  }

  .close-beta:hover {
    color: white;
  }

  /* إضافة مسافة في أسفل الصفحة حتى لا يغطي الشريط آخر محتوى في الموقع */
  body {
    padding-bottom: 50px; 
  }
  
 
  

        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        :root {
            --primary: #06b6d4;
            --accent: #8b5cf6;
            --bg: #020617;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }

        #app-container.not-logged-in #dash-screen {
            display: none !important;
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .screen {
            display: none;
            height: 100vh;
            width: 100%;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }

        .btn-glow:active { transform: scale(0.95); }

        .level-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .level-card.unlocked:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .modal {
            position: fixed; inset: 0; z-index: 1000;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
            padding: 1rem;
        }

        .modal.active { display: flex; }

        input {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
            text-align: center;
        }

        .stat-badge {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
        }

        /* Feedback Animation */
        .feedback-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }



        
  
    </style>

    
</head>
<body class="bg-slate-950">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[2000] glass px-6 py-3 rounded-2xl text-sm font-bold opacity-0 transition-all pointer-events-none border-cyan-500 text-center min-w-[200px]"></div>

    <div id="app-container" class="not-logged-in">

       <div class="beta-footer-bar" id="betaBar">
  <span class="beta-tag">Beta Version</span>
  <span>هذه النسخة قيد التطوير (تجريبية).!</span>
  <span class="close-beta" onclick="document.getElementById('betaBar').style.display='none'">&times;</span>
</div>
        <!-- Auth Screen -->
        <section id="auth-screen" class="screen active items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-cyan-900/20 via-slate-950 to-slate-950">
            <div class="w-full max-w-md space-y-8">
                <div class="text-center space-y-4">
                    <div class="inline-block p-4 rounded-3xl bg-cyan-500/10 mb-2">
                        <i data-lucide="brain-circuit" class="w-16 h-16 text-cyan-500"></i>
                    </div>
                    <h1 class="text-5xl font-black text-white italic tracking-tighter uppercase">Intelligence<br><span class="text-cyan-500 text-3xl italic">Elite Edition</span></h1>
                </div>

                <div id="auth-box" class="glass p-8 rounded-[3rem] space-y-6 shadow-2xl shadow-cyan-500/10">
                    <div id="login-fields" class="space-y-4">
                        <div class="relative">
                            <i data-lucide="phone" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input type="text" id="l-phone" class="w-full p-5 rounded-2xl font-bold" placeholder="رقم الهاتف">
                        </div>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                            <input type="password" id="l-pass" class="w-full p-5 rounded-2xl font-bold" placeholder="كلمة السر">
                        </div>
                        <button onclick="login()" class="w-full btn-glow py-5 rounded-2xl text-xl font-black">🚀 دخول آمن</button>
                        <div class="flex justify-between px-2 text-xs font-bold">
                            <button onclick="toggleAuth('reg')" class="text-cyan-500">إنشاء حساب جديد</button>
                            <button onclick="toggleAuth('reset')" class="text-slate-500">نسيت كلمة السر؟</button>
                        </div>
                    </div>

                    <div id="reg-fields" class="hidden space-y-4">
                        <div id="reg-avatar-picker" class="flex justify-center gap-2 mb-4 flex-wrap"></div>
                        <input type="text" id="r-name" class="w-full p-4 rounded-2xl font-bold" placeholder="الاسم الكامل">
                        <input type="text" id="r-phone" class="w-full p-4 rounded-2xl font-bold" placeholder="رقم الهاتف">
                        <input type="password" id="r-pass" class="w-full p-4 rounded-2xl font-bold" placeholder="كلمة السر">
                        <button onclick="register()" class="w-full btn-glow py-4 rounded-2xl text-lg font-black">✨ بدء المغامرة</button>
                        <button onclick="toggleAuth('login')" class="w-full text-slate-500 text-sm font-bold">لديك حساب؟ سجل دخول</button>
                    </div>

                    <div id="reset-fields" class="hidden space-y-4">
                        <h3 class="text-center font-bold">استعادة الحساب</h3>
                        <input type="text" id="reset-phone" class="w-full p-4 rounded-2xl font-bold" placeholder="رقم الهاتف المسجل">
                        <div id="otp-area" class="hidden space-y-4">
                            <p class="text-[10px] text-center text-amber-500">رمز التأكيد متاح الآن</p>
                            <input type="text" id="otp-input" class="w-full p-4 rounded-2xl font-mono text-2xl tracking-[1rem]" placeholder="0000">
                        </div>
                        <button id="reset-btn" onclick="handleReset()" class="w-full bg-white/10 py-4 rounded-2xl font-black">إرسال طلب استعادة</button>
                        <button onclick="toggleAuth('login')" class="w-full text-slate-500 text-sm font-bold">رجوع</button>
                    </div>
                </div>
                <p class="text-center text-[10px] text-slate-600 font-bold uppercase tracking-widest">Designed by Marwan Hany • V4.7 Pro</p>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="dash-screen" class="screen !block !p-0">
            <header class="sticky top-0 z-[100] glass p-4 flex justify-between items-center rounded-b-[2.5rem] border-b border-cyan-500/20">
                <div class="flex items-center gap-4">
                    <div class="relative cursor-pointer" onclick="openModal('settings-modal')">
                        <img id="user-avatar" src="" class="w-14 h-14 rounded-2xl border-2 border-cyan-500">
                        <div class="absolute -bottom-1 -left-1 bg-cyan-500 p-1 rounded-lg"><i data-lucide="settings" class="w-3 h-3 text-black"></i></div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="display-name" class="font-black text-xl italic">--</h2>
                            <span id="admin-badge" class="hidden bg-amber-500 text-black text-[9px] px-2 py-0.5 rounded-md font-black">ADMIN</span>
                        </div>
                        <div class="flex gap-2 mt-1">
                            <div class="stat-badge text-[10px] text-cyan-400 font-bold">💎 <span id="display-coins">0</span></div>
                            <div class="stat-badge text-[10px] text-purple-400 font-bold">⭐ <span id="display-xp">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="admin-btn" onclick="openAdminPanel()" class="hidden p-3 bg-cyan-500/10 text-cyan-500 rounded-2xl border border-cyan-500/20"><i data-lucide="shield-check" class="w-5 h-5"></i></button>
                    <button onclick="logout()" class="p-3 bg-red-500/10 text-red-500 rounded-2xl border border-red-500/20"><i data-lucide="power" class="w-5 h-5"></i></button>
                </div>
            </header>

            <main class="max-w-6xl mx-auto p-6 space-y-8 pb-32 overflow-y-auto h-[calc(100vh-100px)]">
                <div class="flex p-1.5 glass rounded-2xl max-w-sm mx-auto">
                    <button onclick="setTab('easy')" id="tab-easy" class="flex-1 py-3 rounded-xl font-black text-sm bg-cyan-500 text-black">🟢 EASY</button>

            <!-- Bottom Actions -->
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 glass px-12 py-4 rounded-[2.5rem] flex gap-8 items-center border border-white/10 shadow-2xl z-[100]">
                <div class="text-cyan-500 flex flex-col items-center gap-1">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="text-[9px] font-bold">الرئيسية</span>
                </div>
                <div class="w-px h-6 bg-white/10"></div>
                <button onclick="showToast('الهدايا متاحة فقط عند الفوز في المستويات!')" class="text-slate-600 flex flex-col items-center gap-1">
                    <i data-lucide="gift" class="w-5 h-5"></i>
                    <span class="text-[9px] font-bold">الجوائز</span>
                </button>
            </nav>
        </section>

    <!-- Win Modal -->

    <div id="feedback-modal" class="modal !z-[2000]">

    <div id="settings-modal" class="modal">

            <h3 class="text-xl font-black flex items-center gap-2"><i data-lucide="user-cog"></i> الإعدادات</h3>
            <div id="settings-avatar-picker" class="flex justify-center gap-2 flex-wrap"></div>
            <input type="text" id="s-name" class="w-full p-4 rounded-xl" placeholder="تغيير الاسم">

    <!-- Game UI -->
    <div id="game-modal" class="modal">
        <div class="glass w-full max-w-md rounded-[3.5rem] p-10 text-center space-y-10">

                <div class="bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">
                    <span class="text-cyan-400 font-black text-[10px]" id="g-level-title">LEVEL 1</span>
                </div>
                <div id="q-counter" class="text-xs text-slate-500 font-bold italic">1/5</div>
            </div>
            <h2 id="question-text" class="text-8xl font-black text-white italic drop-shadow-[0_0_20px_rgba(6,182,212,0.4)]">--</h2>
            <input type="number" id="answer-input" class="w-full text-5xl p-6 text-center rounded-3xl" placeholder="؟">

    <!-- Admin Panel -->
    <div id="admin-modal" class="modal">
        <div class="glass w-full max-w-3xl rounded-[2.5rem] p-6 h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-xl italic text-amber-500">لوحة التحكم</h3>
                <button onclick="closeModal('admin-modal')" class="p-2 bg-white/5 rounded-lg"><i data-lucide="x"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto" id="admin-list"></div>
        </div>
    </div>

    <script>
        const ADMINS = [
            { phone: "01011501465", pass: "201299" },
            { phone: "01011960156", pass: "1255804477" },
            { phone: "01029536146", pass: "mariam" }
        ];

        const AVATARS = [
            "https://api.dicebear.com/7.x/bottts/svg?seed=M1",
            "https://api.dicebear.com/7.x/bottts/svg?seed=M2",
            "https://api.dicebear.com/7.x/bottts/svg?seed=M3",
            "https://api.dicebear.com/7.x/bottts/svg?seed=M4",
            "https://api.dicebear.com/7.x/bottts/svg?seed=M5"
        ];

        let db = JSON.parse(localStorage.getItem('intel_db_v4_marwan') || "[]");
        let currentUser = null;
        let selectedAvatar = AVATARS[0];
        let currentTab = 'easy';
        let qIndex = 0, qAns = 0, correctCount = 0, activeLvl = 1;

        function saveDB() { localStorage.setItem('intel_db_v4_marwan', JSON.stringify(db)); }

        function showToast(msg, error = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed top-6 left-1/2 -translate-x-1/2 z-[2000] glass px-6 py-3 rounded-2xl text-sm font-bold opacity-100 transition-all border ${error ? 'border-red-500 text-red-400' : 'border-cyan-500 text-cyan-400'}`;
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'dash-screen') {
                document.getElementById('app-container').classList.remove('not-logged-in');
                renderDashboard();
            } else {
                document.getElementById('app-container').classList.add('not-logged-in');
            }
            lucide.createIcons();
        }

        function toggleAuth(type) {
            document.getElementById('login-fields').classList.add('hidden');
            document.getElementById('reg-fields').classList.add('hidden');
            document.getElementById('reset-fields').classList.add('hidden');
            if(type === 'login') document.getElementById('login-fields').classList.remove('hidden');
            if(type === 'reg') { 
                document.getElementById('reg-fields').classList.remove('hidden'); 
                renderAvatarPickers('reg-avatar-picker');
            }
            if(type === 'reset') document.getElementById('reset-fields').classList.remove('hidden');
            lucide.createIcons();
        }

        function renderAvatarPickers(cid) {
            const container = document.getElementById(cid);
            container.innerHTML = "";
            AVATARS.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = `w-12 h-12 rounded-xl glass cursor-pointer border-2 transition ${selectedAvatar === url ? 'border-cyan-500 scale-110 shadow-lg' : 'border-transparent'}`;
                img.onclick = () => { selectedAvatar = url; renderAvatarPickers(cid); };
                container.appendChild(img);
            });
        }

        function register() {
            const name = document.getElementById('r-name').value.trim();
            const phone = document.getElementById('r-phone').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            if(!name || !phone || !pass) return showToast("أكمل البيانات", true);
            if(db.find(u => u.phone === phone)) return showToast("الرقم مسجل سابقاً", true);
            const user = { name, phone, pass, avatar: selectedAvatar, maxEasy: 1, maxHard: 1, coins: 50, xp: 0 };
            db.push(user); saveDB(); currentUser = user; nav('dash-screen');
        }

        function login() {
            const p = document.getElementById('l-phone').value.trim();
            const s = document.getElementById('l-pass').value.trim();
            const isAdmin = ADMINS.find(a => a.phone === p && a.pass === s);
            if(isAdmin) {
                currentUser = { name: "Marwan Admin", phone: p, isAdmin: true, avatar: AVATARS[0], coins: 9999, xp: 9999, maxEasy: 50, maxHard: 50 };
                return nav('dash-screen');
            }
            const user = db.find(u => u.phone === p && u.pass === s);
            if(user) { currentUser = user; nav('dash-screen'); }
            else showToast("بيانات الدخول خاطئة", true);
        }

        function handleReset() {
            const p = document.getElementById('reset-phone').value;
            const area = document.getElementById('otp-area');
            const user = db.find(u => u.phone === p);
            if(!user) return showToast("الرقم غير مسجل", true);
            if(area.classList.contains('hidden')) {
                area.classList.remove('hidden');
                showToast("تم التحقق من الحساب");
            } else {
                showToast(`كلمة السر هي: ${user.pass}`);
                setTimeout(() => toggleAuth('login'), 4000);
            }
        }

        function renderDashboard() {
            if(!currentUser) return;
            document.getElementById('display-name').innerText = currentUser.name;
            document.getElementById('user-avatar').src = currentUser.avatar;
            document.getElementById('display-coins').innerText = currentUser.coins;
            document.getElementById('display-xp').innerText = currentUser.xp;
            if(currentUser.isAdmin) {
                document.getElementById('admin-btn').classList.remove('hidden');
                document.getElementById('admin-badge').classList.remove('hidden');
            }
            const container = document.getElementById('levels-container');
            container.innerHTML = "";
            const max = currentTab === 'easy' ? currentUser.maxEasy : currentUser.maxHard;
            for(let i=1; i<=50; i++) {
                const locked = i > max;
                const card = document.createElement('div');
                card.className = `level-card aspect-square rounded-2xl flex flex-col items-center justify-center ${locked ? 'opacity-20 grayscale' : 'unlocked cursor-pointer'}`;
                card.innerHTML = `<span class="text-[8px] font-bold text-slate-500 italic">STG</span><span class="font-black text-2xl">${i}</span>`;
                if(!locked) card.onclick = () => startLevel(i);
                container.appendChild(card);
            }
        }

        function setTab(t) {
            currentTab = t;
            document.getElementById('tab-easy').className = t === 'easy' ? 'flex-1 py-3 rounded-xl font-black text-sm bg-cyan-500 text-black shadow-lg shadow-cyan-500/20' : 'flex-1 py-3 rounded-xl font-black text-sm text-slate-400';
            document.getElementById('tab-hard').className = t === 'hard' ? 'flex-1 py-3 rounded-xl font-black text-sm bg-cyan-500 text-black shadow-lg shadow-cyan-500/20' : 'flex-1 py-3 rounded-xl font-black text-sm text-slate-400';
            renderDashboard();
        }

        function startLevel(lvl) {
            activeLvl = lvl; qIndex = 1; correctCount = 0;
            document.getElementById('g-level-title').innerText = `STG ${lvl}`;
            openModal('game-modal'); generateQuestion();
        }

        function generateQuestion() {
            let n1 = Math.floor(Math.random() * (10 + activeLvl));
            let n2 = Math.floor(Math.random() * (10 + activeLvl));
            if(currentTab === 'easy') { qAns = n1 + n2; document.getElementById('question-text').innerText = `${n1}+${n2}`; }
            else { qAns = n1 * n2; document.getElementById('question-text').innerText = `${n1}×${n2}`; }
            document.getElementById('q-counter').innerText = `${qIndex}/5`;
            document.getElementById('answer-input').value = "";
            document.getElementById('answer-input').focus();
        }

        function showFeedback(correct, answer) {
            const modal = document.getElementById('feedback-modal');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const msg = document.getElementById('feedback-msg');
            
            if(correct) {
                icon.innerText = "✅";
                title.innerText = "إجابة صحيحة!";
                title.className = "text-3xl font-black text-green-400";
                msg.innerText = "+10 درجات ذكاء";
            } else {
                icon.innerText = "❌";
                title.innerText = "إجابة خاطئة!";
                title.className = "text-3xl font-black text-red-500";
                msg.innerText = `الإجابة الصحيحة كانت: ${answer}`;
            }
            
            modal.classList.add('active');
            setTimeout(() => {
                modal.classList.remove('active');
                processNextStep();
            }, 1800);
        }

        function checkAnswer() {
            const val = parseInt(document.getElementById('answer-input').value);
            if(isNaN(val)) return;
            const isCorrect = (val === qAns);
            if(isCorrect) correctCount++;
            showFeedback(isCorrect, qAns);
        }

        function processNextStep() {
            if(qIndex >= 5) {
                // Calculation: Each question 10 XP, total 50. 
                // Each mistake reduces XP by 5 or just give 10 per correct answer.
                // Let's stick to: (Correct Questions * 10) = earned XP.
                const earnedXP = correctCount * 10;
                const earnedCoins = (correctCount >= 4) ? 50 : 0;

                if(correctCount >= 3) { 
                    if(!currentUser.isAdmin) {
                        const idx = db.findIndex(u => u.phone === currentUser.phone);
                        db[idx].coins += earnedCoins;
                        db[idx].xp += earnedXP;
                        if(currentTab === 'easy' && activeLvl === db[idx].maxEasy) db[idx].maxEasy++;
                        if(currentTab === 'hard' && activeLvl === db[idx].maxHard) db[idx].maxHard++;
                        saveDB(); currentUser = db[idx];
                    }
                    
                    document.getElementById('win-xp-val').innerText = earnedXP;
                    document.getElementById('win-coins-val').innerText = earnedCoins;
                    document.getElementById('win-description').innerText = correctCount === 5 ? "أداء أسطوري! درجة كاملة" : `لقد أجبت على ${correctCount} أسئلة صحيحة من 5.`;
                    
                    closeModal('game-modal');
                    openModal('win-modal');
                } else {
                    closeModal('game-modal');
                    showToast("لم تنجح.. أجب على 3 أسئلة صحيحة على الأقل", true);
                }
            } else { 
                qIndex++; 
                generateQuestion(); 
            }
        }

        function closeWinModal() { closeModal('win-modal'); renderDashboard(); }

        function openAdminPanel() {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            db.forEach(u => {
                list.innerHTML += `<div class="p-4 bg-white/5 rounded-2xl mb-2 flex justify-between items-center">
                    <div><b class="text-cyan-400">${u.name}</b><br><span class="text-[10px] text-slate-500">${u.phone}</span></div>
                    <div class="text-center font-bold text-xs text-amber-500">💎 ${u.coins}<br>⭐ ${u.xp}</div>
                    <button onclick="deleteUser('${u.phone}')" class="text-red-500 p-2"><i data-lucide="trash-2"></i></button>
                </div>`;
            });
            openModal('admin-modal'); lucide.createIcons();
        }

        function deleteUser(p) { if(confirm("حذف اللاعب؟")) { db = db.filter(u => u.phone !== p); saveDB(); openAdminPanel(); } }
        function openModal(id) { document.getElementById(id).classList.add('active'); lucide.createIcons(); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function saveSettings() {
            const n = document.getElementById('s-name').value;
            const idx = db.findIndex(u => u.phone === currentUser.phone);
            if(idx !== -1) {
                if(n) db[idx].name = n;
                db[idx].avatar = selectedAvatar;
                saveDB(); currentUser = db[idx];
                closeModal('settings-modal'); renderDashboard();
                showToast("تم الحفظ");
            }
        }

        function logout() { currentUser = null; document.getElementById('app-container').classList.add('not-logged-in'); nav('auth-screen'); }
        window.onload = () => { lucide.createIcons(); };
    </script>
</body>
</html>
